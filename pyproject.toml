[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win-service-kit"
version = "0.2.0"
description = "Chạy script Python/Node 24/24 trên Windows: tự khởi động cùng máy, tự bật lại khi chết, ghi log xoay vòng."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Võ Ngọc Cường" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pytest-cov>=5"]

[project.scripts]
winservice = "winservice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winservice = ["py.typed", "*.ttf", "*.json"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=winservice --cov-report=term-missing"
pythonpath = ["src"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]
