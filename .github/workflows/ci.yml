name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token của workflow chỉ cần đọc mã nguồn
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cài đặt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy (strict)
        run: mypy
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
